<h1 class="text-4xl font-serif m-auto w-fit">Nos Ouvrages</h1>
<h2 class="text-sm text-text-white m-auto w-fit mb-10">Explorez notre collection</h2>
<div class="flex w-full gap-30">
    <div class="w-75 shrink-0 h-4">
        <div>Catégorie</div>
        <div class="rarities">
        </div>
        <div>Prix</div>
        <div class="relative h-6 w-full">
            <div class="absolute top-1/2 h-1 w-full -translate-y-1/2 rounded bg-gray-600"></div>
            <div id="price-progress" class="absolute top-1/2 h-1 -translate-y-1/2 bg-amber-500"></div>

            <input type="range" id="min-price" min="0" max="200" value="20" class="price-range absolute top-0 w-full">
            <input type="range" id="max-price" min="0" max="200" value="150" class="price-range absolute top-0 w-full">
        </div>
        <div class="flex justify-between text-text-grey mt-4">
            <span id="min-value"></span>
            <span id="max-value"></span>
        </div>
    </div>
    <div class="flex-1 w-fit h-fit flex gap-5 flex-wrap" id="books">
    </div>
</div>
