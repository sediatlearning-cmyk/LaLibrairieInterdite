<h1>Displaying book</h1>
<div class="flex w-fit h-fit">
    <div class="w-fit">
        <button class="buttonBookImage block cursor-pointer">
            <div class="book-image w-50 h-50"></div>
        </button>
        <button class="buttonOriginalImage block cursor-pointer">
            <img class="orignal-image w-50 h-50" src="/src/assets/images/chateau.jpg"></img>
        </button>
    </div>
    <div class="selected-image w-100 h-100">
        <img class="w-full h-full" src="/src/assets/images/chateau.jpg"></img>
    </div>
    <div class="flex-1">
        <p class="title text-text-white text-4xl">Grimmoire des élements</p>
        <p class="rarity">Commun</p>
        <p class="detail text-text-grey">Un antique grimmoire détaillant la maitrise des quatres élements fondamentaux : feu, eau, terre et air</p>
        <div class="flex gap-10">
            <div class="border-text-primary border-2 w-fit h-10 my-auto flex items-center overflow-hidden">
                <button type="button" class="bg-[#2e2e2e] h-full w-10 cursor-pointer">-</button>
                <input type="number" id="quantite" name="quantite" min="1" max="10" value="1" class="w-12 text-center outline-none [appearance:textfield] [&::-webkit-inner-spin-button]:appearance-none [&::-webkit-outer-spin-button]:appearance-none">
                <button type="button" class="bg-[#2e2e2e] h-full w-10 cursor-pointer">+</button>
            </div>
            <button class="bg-secondary-background text-black flex-auto rounded-xl h-12 cursor-pointer">AJOUTER AU PANIER</button>
        </div>
    </div>
</div>
